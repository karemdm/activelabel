<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t('app.name') }}{% endblock %} · {{ t('app.name') }}</title>
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('theme');
        if (q === 'light' || q === 'dark') { localStorage.setItem('vl-theme', q); }
        var saved = localStorage.getItem('vl-theme');
        if (saved === 'light' || saved === 'dark') { document.documentElement.dataset.theme = saved; }
      } catch (e) { /* storage blocked: follow the system theme */ }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231f5fcf'/%3E%3Cg fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 9V7a2 2 0 0 1 2-2h2M15 5h2a2 2 0 0 1 2 2v2M19 15v2a2 2 0 0 1-2 2h-2M9 19H7a2 2 0 0 1-2-2v-2'/%3E%3Cpath d='m9 12.3 2.2 2.2L15.3 10'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
</head>
<body data-page="{% block page %}{% endblock %}">
  <a class="skip-link" href="#main">{{ t('nav.skip') }}</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></g></svg>
        <span>{{ t('app.name') }}</span>
      </a>
      <nav class="topnav" aria-label="{{ t('nav.main') }}">
        <a href="/">{{ t('nav.projects') }}</a>
      </nav>
      <div class="topbar-tools">
        <div class="lang-switch" role="group" aria-label="{{ t('nav.language') }}">
          {% for code in languages %}
          <a href="?lang={{ code }}" hreflang="{{ code }}" lang="{{ code }}" data-lang="{{ code }}"
             onclick="this.href = location.pathname + '?lang={{ code }}' + location.hash"
             {% if code == lang %}aria-current="true"{% endif %}>{{ code|upper }}</a>
          {% endfor %}
        </div>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="{{ t('nav.theme') }}" title="{{ t('nav.theme') }}">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.5 0-1-.1-1.4A5.5 5.5 0 0 1 13.4 3.1C13 3 12.5 3 12 3z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="main" class="page">
    {% block content %}{% endblock %}
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script>window.I18N = {{ messages|tojson }}; window.VL = {{ vl|tojson }};</script>
  <script src="/static/app.js?v={{ asset_version }}"></script>
</body>
</html>
