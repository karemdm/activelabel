# Run `pre-commit install` once, with the project virtual environment active.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format --check .
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff
        name: ruff (lint, docstrings, annotations)
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        # only the tests that mirror the changed files (the CI runs the whole suite);
        # ACTIVELABEL_HOOK_FULL=1 runs everything
        name: pytest (tests of the changed files)
        entry: python tests/helpers/changed_tests.py
        language: system
        pass_filenames: true
        always_run: true
