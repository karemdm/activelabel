name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to the same pull request cancels the run that is still going (main always finishes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # Unit tests, lint and types. The checkout and the temporary folders are inside a path with accents and
    # spaces (users' names, "Área de Trabalho"), so encoding problems show on every system.
    name: checks (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon (arm64); Python 3.12 is the only supported version
        # macOS runs on main (after a merge) and by hand, not on pull requests: GitHub's macOS machines are
        # scarce and a pull request would wait for them
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      TMPDIR: ${{ github.workspace }}/pasta temporária ção
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/área de trabalho/projeto ação
    steps:
      - uses: actions/checkout@v4
        with:
          path: área de trabalho/projeto ação
          fetch-depth: 0  # the version comes from the git tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: '**/pyproject.toml'
      - name: Temporary folder with accents and spaces
        run: |
          mkdir -p "$TMPDIR"
          echo "TMP=$TMPDIR" >> "$GITHUB_ENV"
          echo "TEMP=$TMPDIR" >> "$GITHUB_ENV"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Mypy
        run: python -m mypy
      - name: Unit tests (coverage must stay at or above 80%, see [tool.coverage] in pyproject.toml)
        run: python -m pytest -q -m "not integration" --cov --cov-report=term-missing --cov-report=xml
      - name: Coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: área de trabalho/projeto ação/coverage.xml
      - name: Command line
        run: activelabel --help

  fiftyone:
    # FiftyOne's bundled database does not run on every runner image: use a MongoDB service
    name: FiftyOne tests (ubuntu-latest, Python 3.12)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      FIFTYONE_DATABASE_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: '**/pyproject.toml'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests that use FiftyOne
        run: python -m pytest -q -m integration

  package:
    # the checks above run on an editable install, which reads the source tree: only the built package
    # shows a data file (page, text, script) that the build leaves out
    name: package (wheel in a clean environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version comes from the git tags (setuptools-scm)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: '**/pyproject.toml'
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps -w dist
      - name: Check that the wheel has a real version (0.0 is accepted only while there is no v* tag yet)
        run: |
          if git describe --tags --match 'v*' --abbrev=0 >/dev/null 2>&1; then
            python tests/package/check_version.py dist/*.whl
          else
            echo "no v* tag yet: the wheel may carry version 0.0 (RELEASING.md)"
            python tests/package/check_version.py dist/*.whl --no-tag-yet
          fi
      - name: Check that the wheel has every file of the package
        run: python tests/package/check_wheel.py dist/*.whl src/activelabel
      - name: Install the wheel (not editable, no extras, so the light install without FiftyOne) in a new environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install dist/*.whl
      - name: Start the installed server and fetch the pages
        # from another folder, so the source tree cannot be imported by mistake
        working-directory: ${{ runner.temp }}
        run: clean/bin/python "$GITHUB_WORKSPACE/tests/package/smoke_server.py" 8765

  training-workers:
    # The workers and the metrics run in the separate training environment, so the jobs above (no PyTorch)
    # skip their tests. Here PyTorch is installed (CPU) and a skipped torch test fails the job.
    # The managed training environment installs the versions pinned in training/environment.py
    # (PINNED_VERSIONS, #160); this job installs the same ones, read from that module.
    name: training workers (torch CPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the app, the pinned CPU-only PyTorch and timm, and scikit-learn (reference for the metric tests only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pinned() { python -c "import sys; from activelabel.training.environment import pin; print(' '.join(pin(p) for p in sys.argv[1:]))" "$@"; }
          python -m pip install $(pinned torch torchvision) --index-url https://download.pytorch.org/whl/cpu
          python -m pip install $(pinned timm) scikit-learn
          python -c "import torch, torchvision, timm, sklearn; print(torch.__version__, torchvision.__version__, timm.__version__, sklearn.__version__)"
      - name: Worker and metric tests (none may be skipped for a missing package)
        # only the files that need torch, torchvision, timm or scikit-learn: the checks job already runs the rest
        run: |
          files=$(git grep -lE 'importorskip\("(torch|torchvision|timm|sklearn)|worker_loader' -- 'tests/activelabel/training')
          echo "$files"
          python -m pytest -q -rs -m "not integration" $files | tee "$RUNNER_TEMP/pytest.log"
          if grep -E "SKIPPED.*(could not import|torch|timm|sklearn|scikit)" "$RUNNER_TEMP/pytest.log"; then
            echo "a training test was skipped for a missing package" >&2
            exit 1
          fi

  ui:
    # Tests of the web interface: node:test + jsdom for the script's logic, Playwright (Chromium) for the main
    # path against a real server. Self-contained: nothing else in this file depends on it.
    name: ui (node + playwright)
    runs-on: ubuntu-24.04  # Playwright 1.52 has no Chromium build for newer Ubuntu images yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: '**/pyproject.toml'
      - name: Install the app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install the Node tools
        # no package-lock.json in the repository yet: npm install, with the exact versions pinned in package.json
        run: npm install --no-audit --no-fund
      - name: Unit tests (node:test + jsdom)
        run: npm run test:js
      - name: Smoke tests (Playwright on the runner's Google Chrome, real server on port 8107)
        env:
          PW_CHANNEL: chrome  # preinstalled on GitHub's Ubuntu runners: no browser download (that step hung)
        timeout-minutes: 10
        run: npm run test:e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
