name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: checks (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon (arm64)
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          # Python 3.13 is tried, but does not fail the run: it depends on the wheels of FiftyOne and its
          # dependencies for 3.13. Remove "experimental" when this leg is green.
          - os: ubuntu-latest
            python: "3.13"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Mypy
        run: python -m mypy
      - name: Unit tests (coverage must stay at or above 80%, see [tool.coverage] in pyproject.toml)
        run: python -m pytest -q -m "not integration" --cov --cov-report=term-missing --cov-report=xml
      - name: Coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Command line
        run: activelabel --help

  paths:
    # a workspace folder with accents and spaces (users' names, "Área de Trabalho"): the temporary folders of
    # the tests are inside such a path too
    name: path with accents and spaces (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TMPDIR: ${{ github.workspace }}/pasta temporária ção
    steps:
      - uses: actions/checkout@v4
        with:
          path: área de trabalho/projeto ação
          fetch-depth: 0  # the version comes from the git tags (setuptools-scm)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and run the unit tests from that folder
        shell: bash
        working-directory: ${{ github.workspace }}/área de trabalho/projeto ação
        run: |
          mkdir -p "$TMPDIR"
          export TMP="$TMPDIR" TEMP="$TMPDIR"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q -m "not integration"
          activelabel --help

  fiftyone:
    # FiftyOne's bundled database does not run on every runner image: use a MongoDB service
    name: FiftyOne tests (ubuntu-latest, Python 3.12)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      FIFTYONE_DATABASE_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests that use FiftyOne
        run: python -m pytest -q -m integration

  package:
    # the checks above run on an editable install, which reads the source tree: only the built package
    # shows a data file (page, text, script) that the build leaves out
    name: package (wheel in a clean environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps -w dist
      - name: Check that the wheel has every file of the package
        run: python tests/package/check_wheel.py dist/*.whl src/activelabel
      - name: Install the wheel (not editable) in a new environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install dist/*.whl
      - name: Start the installed server and fetch the pages
        # from another folder, so the source tree cannot be imported by mistake
        working-directory: ${{ runner.temp }}
        run: clean/bin/python "$GITHUB_WORKSPACE/tests/package/smoke_server.py" 8765

  training-workers:
    # The workers and the metrics run in the separate training environment, so the jobs above (no PyTorch)
    # skip their tests. Here PyTorch is installed (CPU) and a skipped torch test fails the job.
    # The managed training environment (training/environment.py) does not pin versions: it installs the
    # latest torch/torchvision from the PyTorch index and timm from PyPI; this job does the same.
    name: training workers (torch CPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the app, CPU-only PyTorch and timm, and scikit-learn (reference for the metric tests only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install timm scikit-learn
          python -c "import torch, torchvision, timm, sklearn; print(torch.__version__, torchvision.__version__, timm.__version__, sklearn.__version__)"
      - name: Worker and metric tests (none may be skipped for a missing package)
        run: |
          python -m pytest -q -rs -m "not integration" tests/activelabel/training | tee "$RUNNER_TEMP/pytest.log"
          if grep -E "SKIPPED.*(could not import|torch|timm|sklearn|scikit)" "$RUNNER_TEMP/pytest.log"; then
            echo "a training test was skipped for a missing package" >&2
            exit 1
          fi
