[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "activelabel"
version = "0.1.0"
description = "Image datasets from curation to trained models: projects, images, annotations, curation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Karem Daiane Marcomini" }]
keywords = ["computer vision", "annotation", "dataset curation", "CVAT", "FiftyOne", "training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pillow>=10",
    # reads videos and extracts their frames (also a FiftyOne dependency)
    "opencv-python-headless>=4.8",
    "pyyaml>=6",
    # tested with FiftyOne 1.22; without the lower bound pip may pick a much older release
    "fiftyone>=1.22,<2",
    # graphql-core 3.3 removed an API that the GraphQL library used by the FiftyOne App imports
    "graphql-core<3.3",
    # importlib-metadata 8+ raises KeyError where FiftyOne's eta package expects None (Python < 3.12)
    "importlib-metadata<8",
    # secrets of the annotation tools (passwords, tokens) live in the system keyring, never in files
    "keyring>=24",
    "psutil>=5.9",  # stop the process tree of a cancelled install or training
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/karemdm/activelabel"
Documentation = "https://github.com/karemdm/activelabel/tree/main/docs"
Source = "https://github.com/karemdm/activelabel"
Issues = "https://github.com/karemdm/activelabel/issues"

[project.scripts]
activelabel = "activelabel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
activelabel = ["i18n/*.json", "web/templates/*.html", "web/static/*"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "ANN"]
ignore = [
    "ANN401",        # Any is used for third-party objects without type hints
    "D105", "D107",  # magic methods / __init__ documented by the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["activelabel"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["activelabel"]
branch = true
omit = [
    # The training workers run as scripts in the separate, on-demand training environment (PyTorch,
    # torchvision), never in the environment that runs the tests, so they cannot be measured here.
    "*/activelabel/training/workers/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/helpers"]
markers = ["integration: needs FiftyOne (its database starts on first use)"]
addopts = "-p no:cacheprovider --import-mode=importlib"
